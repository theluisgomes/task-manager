name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: taskmanager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1; then
              echo "MySQL port is open"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/taskmanager_test

      - name: Database smoke test
        run: pnpm run doctor --smoke
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/taskmanager_test

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/taskmanager_test
          JWT_SECRET: ci-test-secret
